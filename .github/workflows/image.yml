name: image

# The hosted server's image (ghcr.io/kdraigo/kdraigo-mcp), built on a release
# tag. This repository is public, so it builds on GitHub's runners only and
# never on the platform's self-hosted runner; the deployment repository
# deploys the image (mcp/docker-compose.yml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kdraigo-mcp:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/kdraigo-mcp:latest
